x-app: &app
  build: .
  volumes:
    - .:/rails
    - bundle_data:/usr/local/bundle
  environment:
    RAILS_ENV: development
    REDIS_URL: redis://redis:6379/0
    GOOGLE_API_KEY: AIzaSyAfTtUxRFP05tEZ1LocvboObCvgmqgRBjg
  depends_on:
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    command: sh -c "rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0 -p 3000 --dev-caching"
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true

  css:
    <<: *app
    command: bin/rails tailwindcss:watch[always]

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  bundle_data: